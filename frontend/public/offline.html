<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#861f41" />
    <title>Offline | Offers+</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #1f2937; background: #f9fafb; }
      main { width: min(100%, 440px); padding: 40px; text-align: center; border-radius: 24px; background: white; box-shadow: 0 16px 40px rgb(0 0 0 / 8%); }
      .icon { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 18px; color: white; background: #861f41; font-size: 36px; font-weight: 700; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; color: #6b7280; }
      button { border: 0; border-radius: 10px; padding: 12px 20px; color: white; background: #861f41; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">+</div>
      <h1>You're offline</h1>
      <p>Reconnect to access your latest applications and career data.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
