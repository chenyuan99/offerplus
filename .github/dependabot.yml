version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "chenyuan99"

  # Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    # The frontend's OpenAPI and ESLint tooling does not yet support TypeScript 7.
    # Keep receiving compatible updates; revisit major upgrades when peers support them.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "chenyuan99"

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "chenyuan99"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "chenyuan99"
