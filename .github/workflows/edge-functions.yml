name: Edge functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test
        working-directory: supabase/functions
        run: deno test
      - name: Integration test against Postgres + PostgREST
        run: supabase/functions/agent-api/integration/run.sh
