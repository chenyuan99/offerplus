name: Edge functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  push:
    branches: [develop, master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check and test
        working-directory: supabase/functions
        run: deno test
      - name: Integration test against Postgres + PostgREST
        run: supabase/functions/agent-api/integration/run.sh
