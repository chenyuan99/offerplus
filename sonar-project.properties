sonar.projectKey=chenyuan99_offerplus
sonar.organization=chenyuan99

# Exclude data-pipeline scripts and SQL migrations from duplication detection.
# These files contain embedded SQL/boilerplate that intentionally mirrors
# migration files and are not production application code.
sonar.cpd.exclusions=h1b/**,supabase/migrations/**,backend/migrations/**

# Exclude binary assets, lock files, and generated files from analysis entirely.
sonar.exclusions=**/*.gz,**/*.zip,**/package-lock.json,**/node_modules/**
