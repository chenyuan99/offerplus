  <!-- Subtle ring -->
  <circle cx="512" cy="512" r="290" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="36"/>

  <!-- Plus sign -->
  <rect x="268" y="448" width="488" height="128" rx="64" fill="white"/>
  <rect x="448" y="268" width="128" height="488" rx="64" fill="white"/>
</svg>
